services:
  thornwood:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - labnet
    depends_on:
      - internal-metadata

  # Internal-only service: NOT published to the host. Only the portal
  # container can reach it, on the lab network, under the hostname the
  # portal's own config refers to. Stands in for an internal metadata /
  # config endpoint that should never be reachable from outside the mesh.
  internal-metadata:
    build: ./internal-metadata
    environment:
      - PORT=8099
    networks:
      labnet:
        aliases:
          - internal-metadata.thornwood.local
    # no ports: — deliberately not exposed to the host

networks:
  labnet:
    driver: bridge
    internal: true
