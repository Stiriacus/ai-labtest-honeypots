{% extends "base.html" %}
{% block title %}Tenants — Harrowgate{% endblock %}
{% block content %}
<h1>Tenants</h1>
<div class="card">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Unit</th><th>Record payment</th></tr></thead>
    <tbody>
      {% for t in tenants %}
      <tr>
        <td>{{ t.full_name }}</td>
        <td>{{ t.email }}</td>
        <td>{{ t.unit_number or "—" }}</td>
        <td>
          <form method="post" action="/admin/payments/record" style="display:flex;gap:6px;align-items:center;">
            <input type="hidden" name="tenant_id" value="{{ t.id }}" />
            <input type="number" name="amount_cents" placeholder="cents" style="width:90px;" required />
            <input type="text" name="memo" placeholder="memo" style="width:140px;" />
            <button class="btn small" type="submit">Record</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
